  :root { --purple:#2e0048; --purple2:#5d2189; --gold:#f0c000; --cream:#faf7f2; --ink:#2a0f4a; --muted:#6d5f7a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI,Arial,sans-serif; color:var(--ink); background:var(--cream); line-height:1.55; }
  .toolbar { background:var(--purple); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .toolbar img { height:36px; }
  .toolbar button { background:var(--gold); color:#241032; border:0; border-radius:9px; padding:10px 16px; font-weight:800; font-size:15px; cursor:pointer; font-family:inherit; }
  .toolbar a { color:#fff; font-size:14px; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 18px 60px; }
  .cover { text-align:center; margin-bottom:22px; }
  .cover img { max-width:78%; max-height:14cm; border-radius:8px; }
  .tag { display:inline-block; background:#efe4f4; color:var(--purple2); font-size:11px; font-weight:700; letter-spacing:.12em; padding:6px 10px; border-radius:99px; text-transform:uppercase; }
  h1 { font-family:Georgia,serif; font-size:clamp(30px,5vw,42px); color:var(--purple); margin:12px 0 6px; }
  .meta { color:var(--muted); font-size:14px; margin:0 0 22px; }
  .band { background:var(--purple); color:#fff; border-radius:14px; padding:22px 24px; margin:20px 0; }
  .band .total { font-family:Georgia,serif; font-size:44px; color:var(--gold); line-height:1; }
  .band h2 { font-family:Georgia,serif; color:var(--gold); margin:6px 0; font-size:22px; }
  .band p { margin:6px 0 0; color:#e8dceb; }
  .card { background:#fff; border:1px solid #e8e0ea; border-radius:14px; padding:20px 22px; margin:16px 0; }
  .card h2 { font-family:Georgia,serif; color:var(--purple); font-size:21px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid #eee5f0; vertical-align:top; }
  th { color:var(--purple2); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
  td.score { text-align:center; font-weight:800; font-size:17px; color:var(--purple2); width:52px; }
  tr.low td { background:#fff8dc; }
  ol { padding-left:22px; margin:8px 0 0; }
  li { margin:10px 0; }
  .cta { background:var(--gold); border-radius:14px; padding:22px; margin-top:22px; }
  .cta h2 { font-family:Georgia,serif; color:#241032; margin:0 0 8px; }
  .cta a { display:inline-block; background:var(--purple); color:#fff; text-decoration:none; font-weight:700; border-radius:9px; padding:11px 18px; margin:8px 8px 0 0; font-size:14px; }
  .fine { color:var(--muted); font-size:12px; margin-top:18px; }
  .error { background:#fff; border:1px solid #e8e0ea; border-radius:14px; padding:30px; text-align:center; }
  @media print {
    body { background:#fff; }
    .toolbar, .cta, .fine { display:none !important; }
    .wrap { max-width:none; padding:0; }
    .cover img { max-height:11cm; }
    .card, .band { break-inside:avoid; }
    table, tr { break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <img src="/assets/logo-softlife-header.png" alt="The Soft Life System">
  <div><button type="button" id="print">Print / Save as PDF</button> &nbsp;<a href="/tools/scorecard.html">Take the scorecard →</a></div>
</div>

<div class="wrap" id="report"><p>Loading your report…</p></div>

<script>
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function showError(msg) {
  $("report").innerHTML = "";
  const box = el("div", "error");
  box.appendChild(el("h1", null, "We couldn't open that report"));
  box.appendChild(el("p", null, msg));
  const a = el("a", null, "Take the free Soft Life Scorecard →"); a.href = "/tools/scorecard.html";
  box.appendChild(a);
  $("report").appendChild(box);
}
$("print").addEventListener("click", () => window.print());

(async () => {
  const token = new URLSearchParams(location.search).get("t") || "";
  let data;
  try {
    const res = await fetch("/api/lead/result?t=" + encodeURIComponent(token), { cache: "no-store" });
    if (!res.ok) throw new Error("This link is invalid or has expired. Your report is still available by taking the scorecard again.");
    data = await res.json();
  } catch (e) { showError(e.message); return; }

  const r = data.result || {};
  const rows = r.rows || [];
  const wrap = $("report"); wrap.innerHTML = "";

  const cover = el("div", "cover");
  const img = document.createElement("img");
  img.src = "/assets/lead-magnets/scorecard-cover.png";
  img.alt = "The Soft Life Scorecard";
  cover.appendChild(img); wrap.appendChild(cover);

  wrap.appendChild(el("span", "tag", "Your personal result"));
  wrap.appendChild(el("h1", null, "The Soft Life Scorecard"));
  const date = new Date(data.created_at.replace(" ", "T") + "Z");
  wrap.appendChild(el("p", "meta", "Prepared for " + (data.name || "you") + " · " + date.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })));

  const band = el("div", "band");
  band.appendChild(el("div", "total", (r.total || 0) + " / 80"));
  band.appendChild(el("h2", null, (r.band && r.band.label) || "Your score"));
  band.appendChild(el("p", null, (r.band && r.band.text) || ""));
  wrap.appendChild(band);

  const tableCard = el("div", "card");
  tableCard.appendChild(el("h2", null, "Your 8 dimensions"));
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  ["Dimension", "What a 10 looks like", "Score"].forEach(t => hr.appendChild(el("th", null, t)));
  thead.appendChild(hr); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = el("tr", (r.bottom || []).includes(row.key) ? "low" : "");
    tr.appendChild(el("td", null, row.label));
    tr.appendChild(el("td", null, row.ten));
    tr.appendChild(el("td", "score", String(row.score)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody); tableCard.appendChild(table); wrap.appendChild(tableCard);

  const bottomLabels = rows.filter(x => (r.bottom || []).includes(x.key)).map(x => x.label).join(" and ");
  const topLabels = rows.filter(x => (r.top || []).includes(x.key)).map(x => x.label).join(" and ");
  const insight = el("div", "card");
  insight.appendChild(el("h2", null, "The two that are running everything"));
  insight.appendChild(el("p", null, r.headline || ""));
  insight.appendChild(el("p", null, "Your strongest dimensions: " + topLabels + ". " + (r.focusNote || "")));
  insight.appendChild(el("p", null, "Write them down: " + bottomLabels + ". The fix is never 'work harder on those two' — it is upstream, in your offer, your delivery and your week."));
  wrap.appendChild(insight);

  const actions = el("div", "card");
  actions.appendChild(el("h2", null, "Three moves for this week"));
  const ol = document.createElement("ol");
  (r.actions || []).forEach(a => ol.appendChild(el("li", null, a)));
  actions.appendChild(ol); wrap.appendChild(actions);

  const cta = el("div", "cta");
