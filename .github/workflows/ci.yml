name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: API tests + Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check all Python
        run: python3 -m py_compile $(git ls-files '*.py')
      - name: Run API test suite
        run: python3 -m unittest discover -s 08-app/tests -v

  frontend:
    name: JS syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check app JS
        run: |
          set -e
          for f in $(git ls-files '08-app/app/js/*.js' '08-app/app/sw.js'); do
            node --check "$f"
          done
